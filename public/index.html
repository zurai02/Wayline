<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wayline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="console">
    <!-- Top Chrome -->
    <div class="chrome">
      <div class="brand" title="Wayline Browser">
        <span class="brand-dot"></span>
        <span class="brand-name">WAYLINE</span>
      </div>
      <div class="tab-strip" id="tabStrip"></div>
      <button class="key key-new" id="newTabBtn" title="New Tab (Ctrl+T)">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="7" y1="3" x2="7" y2="11"/><line x1="3" y1="7" x2="11" y2="7"/></svg>
      </button>
    </div>

    <!-- Nav Row -->
    <div class="navrow">
      <div class="nav-keys">
        <button class="key" id="backBtn" title="Back (Alt+Left)">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="10 3 4 7 10 11"/></svg>
        </button>
        <button class="key" id="fwdBtn" title="Forward (Alt+Right)">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 3 10 7 4 11"/></svg>
        </button>
        <button class="key" id="reloadBtn" title="Reload (Ctrl+R)">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 1 4 1"/><path d="M1 7a6 6 0 0 1 6-6 5.9 5.9 0 0 1 4.2 1.8l-2.2 2.2"/><polyline points="13 10 13 13 10 13"/><path d="M13 7a6 6 0 0 1-6 6 5.9 5.9 0 0 1-4.2-1.8l2.2-2.2"/></svg>
        </button>
        <button class="key" id="homeBtn" title="Home">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6L7 2l5 4"/><path d="M3 5.5v6a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-6"/></svg>
        </button>
      </div>

      <form class="lcd" id="addressForm" autocomplete="off">
        <span class="lcd-status" id="lcdStatus" title="Status"></span>
        <input class="lcd-input" id="addressInput" type="text" placeholder="Enter waypoint or search…" spellcheck="false" autocomplete="off">
        <button class="lcd-go" type="submit">GO</button>
      </form>

      <button class="key key-bookmark" id="bookmarkBtn" title="Bookmark (Ctrl+D)">
        <svg id="bookmarkIcon" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2l1.5 4h4L9.5 8.5l1.5 4L7 10l-4 2.5 1.5-4L1.5 6h4z"/></svg>
      </button>
    </div>

    <!-- Bookmark Rail -->
    <div class="bookmark-rail" id="bookmarkRail"></div>

    <!-- Viewport -->
    <div class="viewport" id="viewport"></div>

    <!-- Status Bar -->
    <div class="statusbar">
      <span id="statusText">Ready.</span>
      <span id="statusRight">Wayline v2.0</span>
    </div>
  </div>

  <!-- Dashboard Template -->
  <template id="dashboardTemplate">
    <div class="dashboard">
      <div class="dashboard-mark">
        <div class="dashboard-ring"></div>
        <div class="dashboard-tagline" id="dashTagline">One console. Every waypoint.</div>
      </div>
      <form class="dashboard-search" id="dashSearchForm">
        <input type="text" id="dashSearchInput" placeholder="Search or enter address…" autocomplete="off" spellcheck="false">
        <button type="submit">GO</button>
      </form>
      <div class="dashboard-links" id="dashLinks"></div>
    </div>
  </template>

  <!-- Context Menu -->
  <div class="context-menu" id="contextMenu">
    <div class="ctx-item" data-action="reload">Reload</div>
    <div class="ctx-item" data-action="duplicate">Duplicate</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item ctx-danger" data-action="close">Close Tab</div>
    <div class="ctx-item ctx-danger" data-action="close-others">Close Others</div>
  </div>

  <script src="/js/app.js"></script>
</body>
        </html>
