<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wayline — one console, every waypoint</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%231F1B24%22/><circle cx=%2250%22 cy=%2250%22 r=%2222%22 fill=%22none%22 stroke=%22%23E8A33D%22 stroke-width=%228%22/><circle cx=%2250%22 cy=%2250%22 r=%226%22 fill=%22%234FA9A0%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="console">

  <!-- Top chrome: traffic keys, tab strip, new-tab key -->
  <header class="chrome">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">WAYLINE</span>
    </div>

    <div class="tab-strip" id="tabStrip" role="tablist" aria-label="Open tabs"></div>

    <button class="key key-new" id="newTabBtn" title="New tab (Ctrl/Cmd+T)" aria-label="New tab">
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
  </header>

  <!-- Nav row: back/forward/reload, LCD address readout, bookmark + go -->
  <div class="navrow">
    <div class="nav-keys">
      <button class="key" id="backBtn" title="Back" aria-label="Back">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="key" id="fwdBtn" title="Forward" aria-label="Forward">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="key" id="reloadBtn" title="Reload" aria-label="Reload">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 12a8 8 0 0 1 13.66-5.66M20 12a8 8 0 0 1-13.66 5.66M4 4v5h5M20 20v-5h-5" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="key" id="homeBtn" title="Home" aria-label="Home">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 11.5 12 4l8 7.5M6 10v9h5v-5h2v5h5v-9" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <form class="lcd" id="addressForm" autocomplete="off">
      <span class="lcd-status" id="lcdStatus" aria-hidden="true"></span>
      <input class="lcd-input" id="addressInput" type="text" spellcheck="false"
             placeholder="Search Wayline or enter a waypoint (URL)…" aria-label="Address bar">
      <button class="lcd-go" type="submit" aria-label="Go">GO</button>
    </form>

    <button class="key key-bookmark" id="bookmarkBtn" title="Bookmark this page" aria-label="Bookmark">
      <svg viewBox="0 0 24 24" width="16" height="16" id="bookmarkIcon"><path d="M6 3h12v18l-6-4.5L6 21V3z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <!-- Bookmark rail -->
  <div class="bookmark-rail" id="bookmarkRail" aria-label="Bookmarks"></div>

  <!-- Viewport: either the dashboard (new tab) or an iframe -->
  <main class="viewport" id="viewport">
    <!-- populated by app.js -->
  </main>

  <footer class="statusbar">
    <span id="statusText">Ready.</span>
    <span class="statusbar-right">Wayline · self-hosted console</span>
  </footer>
</div>

<template id="dashboardTemplate">
  <div class="dashboard">
    <div class="dashboard-mark">
      <div class="dashboard-ring"></div>
      <div class="dashboard-tagline" id="dashTagline">One console. Every waypoint.</div>
    </div>
    <form class="dashboard-search" id="dashSearchForm" autocomplete="off">
      <input type="text" id="dashSearchInput" placeholder="Search the web, or paste a URL…" aria-label="Search">
      <button type="submit">Go</button>
    </form>
    <div class="dashboard-links" id="dashLinks"></div>
  </div>
</template>

<script src="/js/app.js"></script>
</body>
          </html>
